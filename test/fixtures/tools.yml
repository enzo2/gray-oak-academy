# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

one:
  specifications:
    name: "Chalkboard_URL"
    description: "Updates the chalkboard to display a URL in an iframe."
    parameters: {
      type: "object",
      properties: {
        url: {
          type: "string",
          description: "The URL to load in the chalkboard iframe."
        }
      },
      required: [ "url" ]
    }
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

two:
  specifications:
    name: "Chalkboard_File"
    description: "Displays a file from the lesson resources on the chalkboard. Images and PDFs can be displayed natively; other types will be displayed as a downloadlink."
    parameters: {
      type: "object",
      properties: {
        resource_id: {
          type: "string",
          description: "The ID of the resource containing the file to display. Only use explicitly provided IDs from the list of resources. Do not make up IDs."
        }
      },
      required: [ "resource_id" ]
    }
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

generate_course_outline:
  specifications:
    name: "generate_course_outline"
    description: "Generate course outline for a course"
    parameters:
      type: "object"
      properties:
        course_id:
          type: "integer"
          description: "Course ID"
      required: [ "course_id" ]
    strict_mode: true
  access: admin
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

create_course:
  specifications:
    name: "create_course"
    description: "Create a new course"
    parameters:
      type: "object"
      properties:
        title:
          type: "string"
          description: "Course title"
        summary:
          type: "string"
          description: "Course summary"
        grade_level:
          type: "string"
          description: "Grade level"
      required: [ "title", "summary", "grade_level" ]
    strict_mode: true
  access: admin
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>
