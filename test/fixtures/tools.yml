# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

one:
  specifications:
    name: "Show_On_Chalkboard"
    description: "Displays lesson resources on the chalkboard. Provide exactly one argument: either a URL or a resource_id."
    strict_mode: true
    parameters:
      type: "object"
      properties:
        url:
          type: "string"
          description: "URL to load in the chalkboard iframe."
        resource_id:
          type: "string"
          description: "ID of the resource to display on the chalkboard."
      additionalProperties: false
      oneOf:
        - required: [ "url" ]
        - required: [ "resource_id" ]
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

generate_course_outline:
  specifications:
    name: "generate_course_outline"
    description: "Generate course outline for a course"
    parameters:
      type: "object"
      properties:
        course_id:
          type: "integer"
          description: "Course ID"
      required: [ "course_id" ]
    strict_mode: true
  access: admin
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

create_course:
  specifications:
    name: "create_course"
    description: "Create a new course"
    parameters:
      type: "object"
      properties:
        title:
          type: "string"
          description: "Course title"
        summary:
          type: "string"
          description: "Course summary"
        grade_level:
          type: "string"
          description: "Grade level"
      required: [ "title", "summary", "grade_level" ]
    strict_mode: true
  access: admin
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>
