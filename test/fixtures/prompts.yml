generate_student_profile:
  title: Generate Student Profile
  category: generate_student_profile
  prompt: |
    You are now synthesizing a comprehensive student profile based on all available data. This profile provides a up-to-date snapshot of the student's learning journey, emphasizing recent progress while acknowledging historical patterns.

    Student: {student_name}
    Today's date: {current_date}
    Previous profile generated: {previous_profile_date}

    === RECENT LESSON REPORTS (most recent first) ===
    {recent_lesson_reports}

    === COURSE COMPLETION REPORTS ===
    {course_reports}

    === APPROVED OBSERVATIONS (most recent first) ===
    {observations}

    === MEMORIES ===
    {memories}
  teacher:
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

generate_student_course_report:
  title: Generate Student Course Report
  category: generate_student_course_report
  prompt: |
    The student has completed the course titled {course_title}. The course summary was: {course_summary}.
    The following were the lessons in the course, their goals, and the student's report following each lesson:
    {lessons}
  teacher:
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

generate_lesson_plan:
  title: Default Lesson Plan Content Generator
  category: generate_lesson_plan
  prompt: |
    I am creating a lesson plan for a lesson titled "{title}" which is part of the course "{course_title}" for grade level {grade_level}.
    The lesson goals are: "{goals}".
    The lesson is to be roughly {approx_duration_min} min long.
    Optionally, also include a "suggested_resources" array, following a similar format but with "type" and "description" keys.
    The supervising teacher has already marked the following resources as validated and available as lesson content (may or may not be pertinent to the lesson):
    {linked_resources}
    Other lessons in this course, which do not need to overlap with this one, include:
    {other_lessons}
  teacher:
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

suggest_resources:
  title: Default Suggest Resources Prompt
  category: suggest_resources
  prompt: |
    Given this lesson, refine and propose resources.
    Lesson title: {title}
    Course title: {course_title}
    Grade level: {grade_level}
    Goals: {goals}
    Duration: {approx_duration_min}
    Lesson content: {lesson_plan_content}
    Existing suggested resources: {suggested_resources}
    Linked resources: {linked_resources}
    Resource rules:
    - Never return already-linked resources in final suggested_resources.
    - If a resource can be added and linked now, do that instead of leaving it in suggested_resources.
    - Non-embeddable URLs are still valid resources; do not discard good sources just because iframe embedding is blocked.
    - Prefer embeddable URLs only when source quality and relevance are otherwise similar.
    - Explicitly evaluate whether an interactive applet would materially improve this lesson.
    - If so, and no similar applet is already linked, create and link one with add_and_link_resource(resource_type: "applet").
    Tag rules (when creating/linking resources):
    - Use sparse, reusable tags only (2-4 broad tags max).
    - Avoid lesson-specific tags like "japan shock".
    - Prefer broad tags such as "productivity", "policy response", "primary source", "1980s".
    - If broad tags are not clear, omit tags.
    If adding applets in this backend job:
    - Provide complete raw JavaScript only (no markdown fences).
    - Runtime root element is id="sandbox".
    - JSX is not supported; use React.createElement.
    Return JSON:
    {"suggested_resources":[{"type":"...","description":"..."}]}
  teacher:
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>

auto_name_conversation:
  title: Auto-Name Conversation
  category: auto_name_conversation
  prompt: |
    You are naming a chat conversation for a sidebar list.

    Based on the transcript below, write a short, specific title (2–6 words) that captures the main topic.
    Rules:
    - No quotes
    - No emojis
    - No trailing punctuation
    - Be concrete; prefer a topic over a generic label
    - If the conversation is too short or generic (e.g. just a greeting) to generate a specific title, return an empty string.

    Transcript:
    {conversation_excerpt}

    Respond in JSON:
    { "title": "..." }
  teacher:
  created_at: <%= Time.now %>
  updated_at: <%= Time.now %>
