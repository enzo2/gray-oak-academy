services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16.1
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: gray_oak_academy_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - app-network

  #plan to remove with Rails 8
  redis:
    image: redis:7.2
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data: