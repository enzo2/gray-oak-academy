services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432
    depends_on:
      - postgres

  postgres:
    image: postgres:16.1
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${APP_NAME// /_| tr '[:upper:]' '[:lower:]'}_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

volumes:
  postgres-data:
