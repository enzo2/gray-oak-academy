# Development runs Solid Queue agent jobs in separate forked processes (see
# config/puma.rb), so the in-process `async` adapter cannot deliver Turbo Stream
# broadcasts made from a job to the browser — they would only appear after a manual
# refresh. Use solid_cable (DB-backed) so those cross-process broadcasts reach
# subscribers live, matching production.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
