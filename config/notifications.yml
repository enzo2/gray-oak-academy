# Define notification events here.
# For example, "conversation.context_warning" becomes Events::ConversationContextWarning (see initializers/events.rb) as well as Notification::Type
# and would be instantiated with: Rails.event.notify(Events::ConversationContextWarning.new(title: ....))
# Every class will then be automatically subscribed to by NotificationSubscriber.
# A corresponding handler method must be defined in NotificationSubscriber (see subscribers/notification_subscriber.rb).
# Events defined here will also be dynamically loaded into the Notification model as Notification::Type, so when a Notification is created with the same event_type,
# the subject and message templates will be used to generate the notification content.

events: 
  conversation.context_warning:
    category: important
    subject: "Context Limit Warning"
    message: "Context limit warning: Conversation with %{user_name} (titled: %{title}) is approaching the token limit. Consider using a model with a longer context limit."
    required_params:
      - user_name
      - title

  lesson.complete:
    category: student_progress
    subject: "Lesson Completed"
    message: "%{student_name} completed lesson: %{lesson_title}."
    required_params:
      - student_name
      - lesson_title
      - report_id

  user.signup:
    category: important
    subject: "New User Signup"
    message: "New user signed up: %{new_user_name} (%{new_user_email})."
    required_params:
      - new_user_name
      - new_user_email
      - new_user_id

  enrollment.report_generated:
    category: student_progress
    subject: "Course Report Ready"
    message: "Course completed: Course Report for %{student_name} in %{course_title} is now available."
    required_params:
      - student_name
      - course_title
      - report_id

  user.limit_exceeded:
    category: important
    subject: "User Limit Exceeded"
    message: "Usage limit exceeded for %{user_name}: %{reason}"
    required_params:
      - user_name
      - reason
      - user_id

  student.profile_generated:
    category: student_progress
    subject: "Student Profile Updated"
    message: "Student profile for %{student_name} has been updated. Current snapshot: %{current_snapshot}"
    required_params:
      - student_name
      - current_snapshot
      - report_id

  observation.generated:
    category: student_progress
    subject: "New Observations"
    message: "%{quantity_str} for %{student_name} from lesson: %{lesson_title}."
    required_params:
      - student_name
      - lesson_title
      - quantity_str
      - student_id

  course_outline_research.started:
    category: agent_ops
    subject: "Course Outline Research Started"
    message: "Queued outline research for %{course_title} (course_id=%{course_id}) by %{teacher_name}."
    required_params:
      - teacher_name
      - teacher_id
      - course_id
      - course_title
      - source
      - stage

  course_outline_research.exa_completed:
    category: agent_ops
    subject: "Course Outline Research Exa Completed"
    message: "Exa research completed for %{course_title}: %{source_anchor_count} anchors, %{coverage_gap_count} gaps, %{factual_note_count} factual notes, %{alternative_approach_count} alternatives."
    required_params:
      - teacher_name
      - teacher_id
      - course_id
      - course_title
      - source
      - stage
      - research_id
      - source_anchor_count
      - coverage_gap_count
      - factual_note_count
      - alternative_approach_count

  course_outline_research.guidance_ready:
    category: agent_ops
    subject: "Course Outline Research Guidance Ready"
    message: "Guidance is ready for %{course_title}: %{question_count} teacher questions generated."
    required_params:
      - teacher_name
      - teacher_id
      - course_id
      - course_title
      - source
      - stage
      - run_id
      - response_id
      - question_count
      - source_anchor_count

  course_outline_research.resume_queued:
    category: agent_ops
    subject: "Course Outline Research Resume Queued"
    message: "Queued apply phase for %{course_title} (run %{run_id}) after teacher input."
    required_params:
      - teacher_name
      - teacher_id
      - course_id
      - course_title
      - source
      - stage
      - run_id
      - question_count
      - source_anchor_count

  course_outline_research.apply_completed:
    category: agent_ops
    subject: "Course Outline Research Apply Completed"
    message: "Apply phase completed for %{course_title} (run %{run_id}, response %{response_id}) after %{tool_turns} tool turns."
    required_params:
      - teacher_name
      - teacher_id
      - course_id
      - course_title
      - source
      - stage
      - run_id
      - response_id
      - tool_turns

  course_outline_research.pipeline_failed:
    category: agent_ops
    subject: "Course Outline Research Failed"
    message: "Course outline research failed for %{course_title} during %{phase}: %{error_message}"
    required_params:
      - teacher_name
      - teacher_id
      - course_id
      - course_title
      - source
      - stage
      - phase
      - run_id
      - response_id
      - error_message

  agent_run.failed:
    category: agent_ops
    subject: "Agent Run Failed"
    message: "Agent run %{run_id} failed: %{error_message}"
    required_params:
      - run_id
      - teacher_name
      - teacher_id
      - model
      - response_id
      - source
      - duration_seconds
      - task_preview
      - error_message

  agent_run.high_tool_call_warning:
    category: agent_ops
    subject: "Agent Run High Tool Call Warning"
    message: "Agent run %{run_id} reached %{total_tool_calls} tool calls after %{turns} turns (threshold: %{warning_threshold})."
    required_params:
      - run_id
      - response_id
      - teacher_name
      - teacher_id
      - model
      - source
      - lesson_plan_id
      - turns
      - total_tool_calls
      - warning_threshold
