# For Production
# Alternative to docker-compose.yml using environment variables instead of .env.production
# Useful if your ENV are defined elsewhere e.g. Portainer
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    restart: always
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@postgres:5432
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      APP_NAME: ${APP_NAME}
      APP_HOST: ${APP_HOST} 
      WEBMASTER_EMAIL_ADDRESS: ${WEBMASTER_EMAIL_ADDRESS}
      SMTP_ADDRESS: ${SMTP_ADDRESS}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TEACHER_SIGNUP_CODE: ${TEACHER_SIGNUP_CODE}
      STUDENT_SIGNUP_CODE: ${STUDENT_SIGNUP_CODE}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEFAULT_MODEL: ${DEFAULT_MODEL}
      ALLOW_SIGNUPS: ${ALLOW_SIGNUPS}
    depends_on:
      - postgres
      - terrarium

  postgres:
    image: pgvector/pgvector:pg17-trixie
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
    - default
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  terrarium:
    image: ghcr.io/khoj-ai/terrarium:latest
    restart: unless-stopped
    networks:
    - default
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres-data:
